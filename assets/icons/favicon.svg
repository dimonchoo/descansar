<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4f46e5;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Background circle -->
  <circle cx="50" cy="50" r="45" fill="url(#grad)"/>
  <!-- Timer icon -->
  <circle cx="50" cy="50" r="30" fill="none" stroke="white" stroke-width="4" opacity="0.3"/>
  <circle cx="50" cy="50" r="30" fill="none" stroke="white" stroke-width="4"
          stroke-dasharray="141.37" stroke-dashoffset="35.34"
          stroke-linecap="round" transform="rotate(-90 50 50)"/>
  <!-- Center dot -->
  <circle cx="50" cy="50" r="4" fill="white"/>
  <!-- Hour hand -->
  <line x1="50" y1="50" x2="50" y2="30" stroke="white" stroke-width="3" stroke-linecap="round"/>
  <!-- Minute hand -->
  <line x1="50" y1="50" x2="65" y2="50" stroke="white" stroke-width="2" stroke-linecap="round"/>
</svg>
